version: "2"

linters:
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      # Spanish user-facing strings trip the English spell checker.
      - linters: [misspell]
        text: ".*"
        source: '".*"'

formatters:
  enable:
    - gofmt
