  # ============================================================================
  # API CALLS (Generic HTTP Client)
  # ============================================================================
  
  # Herramienta genérica para llamar cualquier API REST
  # Las API keys deben estar en variables de entorno (nunca en el YAML)
  # Sintaxis: ${VAR_NAME} se sustituye por os.Getenv("VAR_NAME")
  
  - name: "call_api"
    description: "Llama a una API REST. Soporta GET/POST/PUT/DELETE con headers y body JSON."
    args:
      url: { type: "string", description: "URL del endpoint (puede incluir ${ENV_VAR})" }
      method: { type: "string", description: "Método HTTP: GET, POST, PUT, DELETE (default: GET)" }
      headers: { type: "string", description: "Headers en JSON, ej: '{\"Authorization\": \"Bearer ${API_KEY}\"}'" }
      body: { type: "string", description: "Body de la petición (JSON)" }
    pipeline:
      - type: "native"
        command: "api_call"
        args:
          url: "{{.url}}"
          method: "{{.method}}"
          headers: "{{.headers}}"
          body: "{{.body}}"

