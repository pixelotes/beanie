tools:
  # ============================================================================
  # MATHEMATICS
  # ============================================================================
  
  - name: "calculator"
    description: "Calculadora científica (Qalculate). Úsala para todo cálculo numérico y conversión de unidades."
    args:
      expression: { type: "string", description: "Expresión (ej: '50 mph to km/h', 'sin(45) + 5')" }
    pipeline:
      - type: "exec"
        command: "qalc -t '{{.expression}}'"

  - name: "solve_equation"
    description: "Resuelve sistemas de ecuaciones."
    args:
      equations: { type: "string", description: "Ecuaciones separadas por ; (ej: 'x+y=10; x-y=2')" }
    pipeline:
      - type: "exec"
        command: "qalc -t '{{.equations}}'"

  # ============================================================================
  # WEB & RESEARCH
  # ============================================================================

  - name: "ask_wolfram"
    description: "Consulta a Wolfram Alpha (Hechos, Ciencia, Datos). Requiere API Key en WOLFRAM_APPID."
    args:
      query: { type: "string", description: "Pregunta en inglés (ej: 'Distance to Mars')" }
    pipeline:
      - type: "native"
        command: "http_get"
        args:
          url: "http://api.wolframalpha.com/v1/result?appid=${WOLFRAM_APPID}&i={{.query}}"

  - name: "search_kiwix"
    description: "Busca artículos en la Wikipedia Offline. Devuelve una lista de títulos y rutas."
    args:
      query: { type: "string", description: "Término a buscar (ej: 'Napoleón')" }
    pipeline:
      - type: "exec"
        command: "python3 scripts/kiwix.py search '{{.query}}'"

  - name: "read_kiwix"
    description: "Lee el contenido de un artículo de Wikipedia específico usando su ruta."
    args:
      url_path: { type: "string", description: "La ruta que obtuviste en la búsqueda (ej: '/content/wikipedia_es.../Napoleon.html')" }
    pipeline:
      - type: "exec"
        command: "python3 scripts/kiwix.py read '{{.url_path}}'"

  - name: "read_web_smart"
    description: "Lee una web usando Jina AI (Rápido y limpio). Opción recomendada."
    args:
      url: { type: "string", description: "URL original" }
    pipeline:
      - type: "exec"
        command: "curl -k -s -L 'https://r.jina.ai/{{.url}}'"

  - name: "read_web"
    description: "Lee webs difíciles (Cloudflare/Antibot) usando suplantación de navegador."
    args:
      url: { type: "string", description: "URL completa" }
    pipeline:
      - type: "exec"
        command: "python3 scripts/browser.py '{{.url}}'"

  # ============================================================================
  # UTILITIES & FUN
  # ============================================================================

  - name: "check_weather"
    description: "Consulta el clima actual."
    args:
      location: { type: "string", description: "Ciudad (ej: 'Madrid')" }
    pipeline:
      - type: "exec"
        command: "curl -k -s 'wttr.in/{{.location}}?format=3'"

