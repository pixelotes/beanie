  # ============================================================================
  # HYBRID PIPELINE EXAMPLES
  # ============================================================================

  - name: "get_clean_article"
    description: "Descarga una web difícil y extrae el texto limpio (Pipeline híbrido: Python stealth + Go cleanup)."
    args:
      url: { type: "string", description: "URL a leer" }
    pipeline:
      # Step 1: Python external (Browser Spoofing for hard sites)
      - type: "exec"
        command: "python3 scripts/browser.py '{{.url}}'"
      # Step 2: Native Go (Strip any remaining HTML artifacts)
      - type: "native"
        command: "html_strip_tags"
      # Step 3: Native Go (Final trim)
      - type: "native"
        command: "text_trim"

  - name: "fetch_api_json"
    description: "Descarga datos de una API JSON simple."
    args:
      url: { type: "string", description: "URL de la API" }
    pipeline:
      - type: "native"
        command: "http_get"
        args:
          url: "{{.url}}"
      - type: "native"
        command: "text_trim"

